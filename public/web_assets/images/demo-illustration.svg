<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 460" role="img" aria-labelledby="t d">
  <title id="t">An adwiseri product demo</title>
  <desc id="d">A presenter shows the adwiseri dashboard on a large screen to two people, one with a laptop and one with a question.</desc>
  <defs>
    <linearGradient id="screenFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A2D9A"/>
      <stop offset="1" stop-color="#211867"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#C026D3"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2A1F7A" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- background -->
  <ellipse cx="290" cy="250" rx="255" ry="190" fill="#F3F1FF"/>
  <ellipse cx="300" cy="410" rx="230" ry="26" fill="#E7E3FF"/>

  <!-- faint gears, top left -->
  <g fill="none" stroke="#DDD7FB" stroke-width="5">
    <circle cx="92" cy="52" r="14"/>
    <circle cx="128" cy="40" r="9"/>
  </g>
  <g stroke="#DDD7FB" stroke-width="6" stroke-linecap="round">
    <path d="M92 30 v6 M92 68 v6 M70 52 h6 M108 52 h6 M77 37 l4 4 M103 63 l4 4 M77 67 l4 -4 M103 41 l4 -4"/>
  </g>

  <!-- "..." speech bubble -->
  <g filter="url(#soft)">
    <path d="M232 40 a22 22 0 0 1 22 -22 h40 a22 22 0 0 1 0 44 h-24 l-14 12 l2 -12 a22 22 0 0 1 -26 -22 z" fill="#FFFFFF"/>
  </g>
  <circle cx="258" cy="40" r="4" fill="#D946EF"/><circle cx="274" cy="40" r="4" fill="#D946EF"/><circle cx="290" cy="40" r="4" fill="#D946EF"/>

  <!-- big presentation screen on a stand -->
  <path d="M120 268 l-16 96 M236 268 l16 96" stroke="#2A1F7A" stroke-width="7" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <rect x="44" y="78" width="270" height="190" rx="12" fill="url(#screenFrame)"/>
  </g>
  <rect x="56" y="90" width="246" height="166" rx="6" fill="#FFFFFF"/>
  <rect x="56" y="90" width="246" height="18" rx="6" fill="#695EEE"/>
  <rect x="56" y="100" width="246" height="8" fill="#695EEE"/>
  <circle cx="66" cy="99" r="3" fill="#FFFFFF" opacity=".85"/><circle cx="76" cy="99" r="3" fill="#FFFFFF" opacity=".6"/>
  <!-- screen: highlight card -->
  <rect x="66" y="118" width="86" height="128" rx="8" fill="#F5D0FE"/>
  <rect x="76" y="128" width="50" height="7" rx="3.5" fill="#C026D3"/>
  <rect x="76" y="142" width="66" height="5" rx="2.5" fill="#E9A8F5"/>
  <rect x="76" y="152" width="58" height="5" rx="2.5" fill="#E9A8F5"/>
  <rect x="76" y="198" width="66" height="36" rx="6" fill="#D946EF"/>
  <rect x="84" y="206" width="30" height="6" rx="3" fill="#FFFFFF" opacity=".9"/>
  <rect x="84" y="218" width="44" height="8" rx="4" fill="#FFFFFF"/>
  <!-- screen: pie chart -->
  <circle cx="196" cy="150" r="24" fill="#EDE9FE"/>
  <path d="M196 150 v-24 a24 24 0 0 1 22.8 16.6 z" fill="#695EEE"/>
  <path d="M196 150 l22.8 -7.4 a24 24 0 0 1 -11 27.7 z" fill="#D946EF"/>
  <rect x="230" y="132" width="58" height="6" rx="3" fill="#C4BDF7"/>
  <rect x="230" y="144" width="44" height="6" rx="3" fill="#E4E0FD"/>
  <rect x="230" y="156" width="52" height="6" rx="3" fill="#E4E0FD"/>
  <!-- screen: bar chart -->
  <rect x="168" y="186" width="122" height="60" rx="6" fill="#FAF9FF"/>
  <rect x="180" y="218" width="12" height="20" rx="2" fill="url(#barGrad)"/>
  <rect x="198" y="206" width="12" height="32" rx="2" fill="url(#barGrad)"/>
  <rect x="216" y="212" width="12" height="26" rx="2" fill="url(#barGrad)"/>
  <rect x="234" y="196" width="12" height="42" rx="2" fill="url(#barGrad)"/>
  <rect x="252" y="202" width="12" height="36" rx="2" fill="#695EEE"/>
  <rect x="270" y="192" width="12" height="46" rx="2" fill="#695EEE"/>

  <!-- presenter (standing, pointing at the screen) -->
  <g>
    <rect x="322" y="300" width="15" height="88" rx="7" fill="#211867"/>
    <rect x="342" y="300" width="15" height="88" rx="7" fill="#2A1F7A"/>
    <ellipse cx="327" cy="391" rx="14" ry="6" fill="#111827"/>
    <ellipse cx="352" cy="391" rx="14" ry="6" fill="#111827"/>
    <rect x="314" y="208" width="52" height="100" rx="20" fill="#4C3BB7"/>
    <path d="M330 210 l10 24 l10 -24 z" fill="#FFFFFF"/>
    <rect x="337" y="226" width="6" height="34" rx="3" fill="#D946EF"/>
    <path d="M320 226 q-22 -10 -40 -34" fill="none" stroke="#4C3BB7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="278" cy="189" r="8" fill="#B9774A"/>
    <path d="M362 226 q12 30 6 58" fill="none" stroke="#4C3BB7" stroke-width="14" stroke-linecap="round"/>
    <circle cx="368" cy="288" r="7.5" fill="#B9774A"/>
    <rect x="333" y="186" width="14" height="14" rx="4" fill="#B9774A"/>
    <circle cx="340" cy="174" r="19" fill="#C98C5E"/>
    <path d="M321 172 q0 -24 21 -24 q17 0 19 18 q-8 -8 -20 -6 q-12 2 -20 12 z" fill="#1E1B4B"/>
  </g>

  <!-- attendee 1 (seated, laptop on lap) -->
  <g>
    <path d="M388 374 l-6 34 M440 374 l6 34 M398 374 l2 34" stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"/>
    <rect x="380" y="362" width="66" height="13" rx="6" fill="#E879F9"/>
    <path d="M390 300 q-4 -22 10 -30 q10 -4 20 0 q14 8 10 30 v60 h-40 z" fill="#E879F9"/>
    <rect x="394" y="292" width="40" height="70" rx="16" fill="#FFFFFF"/>
    <rect x="400" y="350" width="58" height="15" rx="7.5" fill="#1E3A8A"/>
    <rect x="446" y="354" width="14" height="46" rx="7" fill="#1E3A8A"/>
    <ellipse cx="458" cy="402" rx="13" ry="5.5" fill="#111827"/>
    <rect x="410" y="276" width="13" height="14" rx="4" fill="#8D5524"/>
    <circle cx="416" cy="263" r="17" fill="#8D5524"/>
    <path d="M399 262 q-1 -21 18 -22 q19 1 17 20 q-6 -10 -18 -9 q-11 1 -17 11 z" fill="#111827"/>
    <path d="M438 318 l34 -6 l-4 32 l-34 6 z" fill="#2A1F7A"/>
    <path d="M441 322 l26 -5 l-3 24 l-26 5 z" fill="#8B7CF6"/>
    <path d="M410 350 l60 -8" stroke="#2A1F7A" stroke-width="5" stroke-linecap="round"/>
    <path d="M402 312 q8 24 30 34" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round"/>
    <circle cx="434" cy="346" r="5.5" fill="#8D5524"/>
  </g>

  <!-- attendee 2 (seated, with a question) -->
  <g>
    <path d="M478 334 l-6 34 M528 334 l6 34" stroke="#C4B5FD" stroke-width="5" stroke-linecap="round"/>
    <rect x="470" y="322" width="64" height="12" rx="6" fill="#E879F9"/>
    <path d="M480 262 q-4 -20 10 -28 q10 -4 20 0 q14 8 10 28 v60 h-40 z" fill="#E879F9"/>
    <rect x="484" y="256" width="38" height="68" rx="16" fill="#15803D"/>
    <rect x="474" y="312" width="52" height="15" rx="7.5" fill="#B45309"/>
    <rect x="474" y="316" width="14" height="46" rx="7" fill="#B45309"/>
    <ellipse cx="478" cy="364" rx="13" ry="5.5" fill="#111827"/>
    <rect x="498" y="240" width="12" height="14" rx="4" fill="#E0AC69"/>
    <circle cx="503" cy="228" r="16" fill="#E0AC69"/>
    <path d="M487 228 q-2 -22 17 -22 q18 1 16 21 l-4 10 q0 -12 -12 -16 q-10 -2 -17 7 z" fill="#7C2D12"/>
    <path d="M490 274 q-14 18 2 28" fill="none" stroke="#15803D" stroke-width="10" stroke-linecap="round"/>
    <rect x="488" y="294" width="14" height="22" rx="3" fill="#1E1B4B"/>
    <path d="M518 272 q14 -16 4 -40" fill="none" stroke="#15803D" stroke-width="10" stroke-linecap="round"/>
    <circle cx="521" cy="230" r="6" fill="#E0AC69"/>
  </g>

  <!-- question bubble -->
  <g filter="url(#soft)">
    <circle cx="456" cy="196" r="20" fill="#FFFFFF"/>
  </g>
  <text x="456" y="204" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#D946EF">?</text>

  <!-- plant -->
  <g>
    <path d="M70 360 q-26 -30 -6 -56 q14 22 6 56 z" fill="#C4B5FD"/>
    <path d="M78 360 q4 -40 34 -48 q-2 30 -34 48 z" fill="#A78BFA"/>
    <path d="M74 362 q-34 -12 -42 -38 q30 2 42 38 z" fill="#E9D5FF"/>
    <path d="M58 360 h40 l-6 34 h-28 z" fill="#4C3BB7"/>
  </g>

  <!-- pencil -->
  <g transform="rotate(18 150 410)">
    <rect x="110" y="404" width="80" height="9" rx="2" fill="#2A1F7A"/>
    <path d="M190 404 l14 4.5 l-14 4.5 z" fill="#F0ABFC"/>
    <rect x="104" y="404" width="8" height="9" rx="2" fill="#D946EF"/>
  </g>

  <!-- sparkles -->
  <path d="M352 104 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z" fill="#D946EF"/>
  <path d="M520 150 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#8B7CF6"/>
  <path d="M28 268 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 z" fill="#8B7CF6"/>
</svg>
